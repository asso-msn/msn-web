description: |
  La Bibliothèque Václav Havel vous invite ce samedi 31 octobre, à la Fête de la Culture du Jeu Vidéo, toute la journée entre 10h et 18h !

  Découvrez librement les différents espaces jeux vidéo de la bibliothèque durant cette journée. MSN y proposera une sélection de jeux musicaux à disposition.
  L'accès à la bibliothèque et aux jeux est complètement gratuit, venez nombreux !

